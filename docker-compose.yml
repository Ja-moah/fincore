services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-fincore}
      POSTGRES_USER: ${DB_USER:-fincore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fincore_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - fincore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-fincore} -d ${DB_NAME:-fincore}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fincore_pgdata:
