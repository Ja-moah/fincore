services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      COVERAGE_FILE: /tmp/fincore.coverage
      PYTEST_ADDOPTS: -o cache_dir=/tmp/fincore-pytest-cache
      STATIC_ROOT: /tmp/fincore-staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-fincore}
      POSTGRES_USER: ${DB_USER:-fincore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fincore_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - fincore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-fincore} -d ${DB_NAME:-fincore}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fincore_pgdata:
