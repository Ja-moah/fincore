name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fincore
          POSTGRES_USER: fincore
          POSTGRES_PASSWORD: fincore_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fincore -d fincore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DEBUG: "False"
      SECRET_KEY: ci-only-secret-key-that-is-never-used-in-production
      JWT_SIGNING_KEY: ci-only-jwt-signing-key-that-is-never-used-in-production
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_NAME: fincore
      DB_USER: fincore
      DB_PASSWORD: fincore_ci
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Check for migration drift
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Validate OpenAPI schema
        run: python manage.py spectacular --validate --file /tmp/fincore-schema.yaml

      - name: Run tests
        run: python -m pytest
